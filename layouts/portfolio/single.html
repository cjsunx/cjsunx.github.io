{{ define "main" }}
<style>
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem;
  align-items: stretch;
  margin-top: 1rem;
}
@media (min-width: 720px) {
  .portfolio-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1100px) {
  .portfolio-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.portfolio-item {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100px;
  padding: 1.25rem 1rem;
  text-decoration: none;
  border: 1px solid color-mix(in srgb, var(--font-color, #ccc) 18%, transparent);
  border-radius: 6px;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  color: inherit;
}
/* Fixed plates — logo contrast stays correct across theme toggle */
.portfolio-item.plate-dark {
  background: #0c0c0c;
  border-color: #2a2a2a;
  color: #f5f5f5;
}
.portfolio-item.plate-light {
  background: #f4f4f1;
  border-color: #d8d8d2;
  color: #151515;
}
.portfolio-item.plate-auto {
  background: transparent;
}
.portfolio-item.plate-dark:hover {
  border-color: var(--primary-color, #1a95e0);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary-color, #1a95e0) 35%, transparent);
}
.portfolio-item.plate-light:hover {
  border-color: var(--primary-color, #1a95e0);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary-color, #1a95e0) 35%, transparent);
}
.portfolio-item.plate-auto:hover {
  border-color: var(--primary-color, #1a95e0);
  background: color-mix(in srgb, var(--font-color, #fff) 6%, transparent);
}
.portfolio-item img {
  max-width: 100%;
  max-height: 56px;
  width: auto;
  height: auto;
  object-fit: contain;
}
</style>
<div class="portfolio-grid">
{{ range .Params.companies }}
  <a class="portfolio-item plate-{{ .plate | default "auto" }}" href="{{ .url }}" target="_blank" rel="noopener noreferrer" title="{{ .name }}">
    <img src="{{ .logo }}" alt="{{ .name }}" loading="lazy">
  </a>
{{ end }}
</div>
{{ end }}
