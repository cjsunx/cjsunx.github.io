{{ define "main" }}
<style>
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 1.5rem;
  align-items: center;
  margin-top: 1rem;
}
.portfolio-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 88px;
  padding: 1rem;
  text-decoration: none;
  border: 1px solid color-mix(in srgb, var(--font-color, #ccc) 18%, transparent);
  border-radius: 6px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.portfolio-logo:hover {
  border-color: var(--primary-color, #1a95e0);
  background: color-mix(in srgb, var(--font-color, #fff) 6%, transparent);
}
.portfolio-logo img {
  max-width: 100%;
  max-height: 48px;
  width: auto;
  height: auto;
  object-fit: contain;
}
.portfolio-logo-fallback {
  font-size: 0.75rem;
  text-align: center;
  color: var(--font-color, inherit);
  line-height: 1.2;
}
</style>
<div class="portfolio-grid">
{{ range .Params.companies }}
  <a class="portfolio-logo" href="{{ .url }}" target="_blank" rel="noopener noreferrer" title="{{ .name }}">
    <img src="{{ .logo }}" alt="{{ .name }}" loading="lazy"
         onerror="this.style.display='none'; this.parentNode.querySelector('.portfolio-logo-fallback').style.display='flex'">
    <span class="portfolio-logo-fallback" style="display:none">{{ .name }}</span>
  </a>
{{ end }}
</div>
{{ end }}
