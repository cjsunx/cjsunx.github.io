{{ define "main" }}
<style>
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem;
  align-items: stretch;
  margin-top: 1rem;
}
@media (min-width: 720px) {
  .portfolio-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1100px) {
  .portfolio-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.portfolio-item {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100px;
  padding: 1.25rem 1rem;
  text-decoration: none;
  border-radius: 6px;
  /* Cohesive black plates for every logo */
  background: #0a0a0a;
  border: 1px solid #2a2a2a;
  color: #f5f5f5;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.portfolio-item:hover {
  border-color: var(--primary-color, #1a95e0);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary-color, #1a95e0) 35%, transparent);
}
.portfolio-item img {
  max-width: 100%;
  max-height: 56px;
  width: auto;
  height: auto;
  object-fit: contain;
}
</style>
<div class="portfolio-grid">
{{ range .Params.companies }}
  <a class="portfolio-item" href="{{ .url }}" target="_blank" rel="noopener noreferrer" title="{{ .name }}">
    <img src="{{ .logo }}" alt="{{ .name }}" loading="lazy">
  </a>
{{ end }}
</div>
{{ end }}
