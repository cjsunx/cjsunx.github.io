{{ define "main" }}
<header class="page-hero">
  <div class="eyebrow">Writing</div>
  <h1 class="page-title">Notes on operating, investing, <span class="accent">and what actually compounds.</span></h1>
  <p class="lede">Essays and working notes. Most recently:</p>
</header>

<div class="posts-index">
  {{ range .Pages.ByDate.Reverse }}
  <article class="post">
    <div class="post-date">{{ .Date.Format "Jan 2, 2006" }}</div>
    <h3 class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="post-excerpt">{{ .Summary | plainify | truncate 240 }}</p>
    <a href="{{ .RelPermalink }}" class="read-more">Read →</a>
  </article>
  {{ end }}
</div>
{{ end }}
